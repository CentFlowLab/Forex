[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Isolamento: tests/conftest.py define GROK_TEST_ISOLATION=1 e DATABASE_URL
# para SQLite temporária. A BD operacional data/grokforex.db é proibida.
filterwarnings =
    ignore::DeprecationWarning
